# NetPulse Configuration
# Copy to config.yaml and fill in your values.
# Many fields below are adjustable live from the dashboard Settings panel.

meraki:
  # Get from Meraki Dashboard > API & Webhooks > Generate new API key
  api_key: "YOUR_MERAKI_API_KEY_HERE"
  # Find via API call: GET /organizations
  organization_id: "YOUR_ORG_ID"
  # Find via API call: GET /organizations/{id}/networks
  network_id: "YOUR_NETWORK_ID"
  # Poll interval in seconds (Meraki allows 5 req/sec, 30s is very safe)
  poll_interval_seconds: 30

# SSIDs to monitor. Numbers must match Meraki's SSID numbers exactly.
# Find via: GET /networks/{id}/wireless/ssids
# Pattern: set employee/staff SSIDs critical=true, keep at least one
# non-critical "control" SSID (e.g. guest) so the Phase-2 pattern can fire
# (critical SSIDs degrade while guest stays healthy).
ssids:
  - name: "corp-primary"
    number: 0
    critical: true
  - name: "corp-mobile"
    number: 1
    critical: true
  - name: "corp-guest"
    number: 2
    critical: false  # Control / baseline network

# Local probes run from this machine
probes:
  enabled: true
  interval_seconds: 15
  # Gateway IP for your local VLAN (check `ipconfig` Default Gateway)
  gateway_ip: "10.0.0.1"
  # Internal DNS server (leave blank to use system resolver)
  dns_server: ""
  # External target (distinguishes internal vs upstream issues)
  external_target: "1.1.1.1"
  # Domain to test DNS resolution against
  dns_test_domain: "example.com"
  # Ping timeout in ms
  ping_timeout_ms: 2000

# Detection thresholds -- all adjustable from the dashboard Settings panel
detection:
  # How long a window of history defines "normal" (300-7200)
  baseline_window_seconds: 1800
  # Which percentile of that window counts as peak (50-100)
  baseline_percentile: 90
  # Samples needed before baseline is trusted (2-30)
  baseline_min_samples: 5
  # % drop from baseline that triggers alert (10-80)
  client_drop_percent: 30
  # Consecutive failed pings before marking gateway/external down (1-10)
  ping_failure_threshold: 3
  # DNS resolution time (ms) considered degraded
  dns_slow_threshold_ms: 500
  # Toggle the specific 'critical SSIDs drop, guest stable' pattern
  phase2_pattern_detection: true

# Alerting -- adjustable from the dashboard Settings panel
alerts:
  desktop_notifications: true
  sound_enabled: true
  # Sound file path (leave blank for system default)
  sound_file: ""
  # Minimum seconds between duplicate alerts (30-1800)
  dedupe_seconds: 300

# Storage -- requires restart to change
database:
  path: "data/netpulse.db"
  retention_days: 30

# Web dashboard -- requires restart to change
web:
  host: "127.0.0.1"
  port: 8787
  # Auto-refresh interval on the dashboard (ms)
  refresh_interval_ms: 5000